name: taki_sandigim
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.0.0
  provider: ^6.1.2
  equatable: ^2.0.5

  # Routing
  go_router: ^14.6.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network (Altın kurları)
  dio: ^5.7.0

  # OCR
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image: ^4.2.0
  path_provider: ^2.1.4

  # UI / Utils
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^5.2.1

  # Export / Share
  excel: ^4.0.6
  pdf: ^3.11.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding_background.png
    - assets/images/onboarding_bg_new.png
    - .env
