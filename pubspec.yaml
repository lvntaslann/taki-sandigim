name: taki_sandigim
description: "Düğün, nişan ve kına hediyelerini kolayca kaydedip takip etmeni sağlayan takı defteri uygulaması."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.0
  firebase_app_check: ^0.3.1

  # Payments / Subscriptions
  purchases_flutter: ^10.8.0

  # State Management
  flutter_bloc: ^9.0.0
  provider: ^6.1.2
  equatable: ^2.0.5

  # Routing
  go_router: ^14.6.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network (Altın kurları)
  dio: ^5.7.0

  # OCR
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image: ^4.2.0
  path_provider: ^2.1.4

  # UI / Utils
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^5.2.1
  google_mobile_ads: ^5.2.0

  # Export / Share
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding_background.png
    - assets/images/onboarding_bg_new.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/taki-sandigim-icon.png"
  adaptive_icon_background: "#032B3D"
  adaptive_icon_foreground: "assets/taki-sandigim-icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/taki-sandigim-icon.png"
    background_color: "#032B3D"
    theme_color: "#032B3D"
